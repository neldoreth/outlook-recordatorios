<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recordatorio desde Outlook</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      color: #242424;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 4px;
    }
    p.subject {
      font-size: 13px;
      color: #616161;
      margin: 0 0 16px;
      word-break: break-word;
    }
    button {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      background: #0f6cbd;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled {
      background: #c8c8c8;
      cursor: default;
    }
    button:hover:not(:disabled) {
      background: #115ea3;
    }
    #estado {
      margin-top: 14px;
      font-size: 12px;
      color: #616161;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #manual {
      margin-top: 10px;
      display: none;
    }
    #manual a {
      font-size: 12px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>Nuevo recordatorio</h1>
  <p class="subject" id="asunto">Cargando correo…</p>
  <button id="btnCrear" disabled>Crear recordatorio</button>
  <div id="estado"></div>
  <div id="manual">
    <p style="font-size:12px;">
      Si no se ha abierto la app de Recordatorios automáticamente, pulsa aquí:
    </p>
    <a id="enlaceManual" href="#">Abrir en Recordatorios</a>
  </div>

  <script>
    var payloadUrl = "";

    Office.onReady(function () {
      var item = Office.context.mailbox.item;
      document.getElementById("asunto").textContent = item.subject || "(sin asunto)";
      document.getElementById("btnCrear").disabled = false;
      document.getElementById("btnCrear").addEventListener("click", crearRecordatorio);
    });

    function crearRecordatorio() {
      var item = Office.context.mailbox.item;
      var subject = item.subject || "";
      var itemId = item.itemId || "";
      var estado = document.getElementById("estado");
      estado.textContent = "Leyendo el correo…";

      item.body.getAsync(Office.CoercionType.Text, function (result) {
        var notes = "";
        if (result.status === Office.AsyncResultStatus.Succeeded) {
          notes = result.value || "";
        }

        var link = "";
        if (itemId) {
          link = "https://outlook.office.com/owa/?ItemID=" +
                 encodeURIComponent(itemId) +
                 "&exvsurl=1&viewmodel=ReadMessageItem";
        }

        var remitente = "";
        try {
          if (item.from && item.from.displayName) {
            remitente = item.from.displayName +
              (item.from.emailAddress ? " <" + item.from.emailAddress + ">" : "");
          }
        } catch (e) { /* no disponible en todos los tipos de item */ }

        var params =
          "titulo=" + encodeURIComponent(subject) +
          "&asunto=" + encodeURIComponent(subject) +
          "&cuerpo=" + encodeURIComponent(notes) +
          "&enlace=" + encodeURIComponent(link) +
          "&remitente=" + encodeURIComponent(remitente);

        payloadUrl = "recordatoriooutlook://crear?" + params;

        document.getElementById("enlaceManual").href = payloadUrl;
        document.getElementById("manual").style.display = "block";
        estado.textContent = "Abriendo Recordatorios…";

        window.location.href = payloadUrl;

        setTimeout(function () {
          estado.textContent =
            "Si no ha pasado nada, usa el enlace de abajo (solo la primera vez macOS puede pedir confirmación).";
        }, 1200);
      });
    }
  </script>
</body>
</html>
