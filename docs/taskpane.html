<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recordatorio desde Outlook</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      color: #242424;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 4px;
    }
    p.subject {
      font-size: 13px;
      color: #616161;
      margin: 0 0 16px;
      word-break: break-word;
    }
    button {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      background: #0f6cbd;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled {
      background: #c8c8c8;
      cursor: default;
    }
    button:hover:not(:disabled) {
      background: #115ea3;
    }
    #estado {
      margin-top: 14px;
      font-size: 12px;
      color: #616161;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h1>Nuevo recordatorio</h1>
  <p class="subject" id="asunto">Cargando correo…</p>
  <button id="btnCrear" disabled>Crear recordatorio</button>
  <div id="estado"></div>

  <script>
    // El WebView del panel bloquea cualquier red directa: ni esquemas de URL
    // personalizados ni conexiones a 127.0.0.1. Lo único que sí funciona sin
    // restricciones son las llamadas a la propia API de Office.js, así que
    // en vez de intentar llegar hasta el Mac desde aquí, solo se etiqueta el
    // correo — un proceso en segundo plano en el Mac (poller/poller.py) es
    // quien detecta la etiqueta vía Microsoft Graph y crea el recordatorio.
    var CATEGORIA = "RecordatorioPendiente";

    Office.onReady(function () {
      var item = Office.context.mailbox.item;
      document.getElementById("asunto").textContent = item.subject || "(sin asunto)";
      document.getElementById("btnCrear").disabled = false;
      document.getElementById("btnCrear").addEventListener("click", crearRecordatorio);
    });

    function crearRecordatorio() {
      var item = Office.context.mailbox.item;
      var estado = document.getElementById("estado");
      var boton = document.getElementById("btnCrear");

      if (!Office.context.requirements.isSetSupported("Mailbox", "1.9")) {
        estado.textContent =
          "Tu versión de Outlook es demasiado antigua para esta función (requiere Mailbox 1.9+).";
        return;
      }

      boton.disabled = true;
      estado.textContent = "Etiquetando el correo…";

      var respondido = false;
      var avisoTimeout = setTimeout(function () {
        if (respondido) return;
        respondido = true;
        boton.disabled = false;
        estado.textContent =
          "La llamada no respondió en 8s (categories.addAsync no ha vuelto). " +
          "Puede que esta versión de Outlook no soporte etiquetar correos desde un add-in.";
      }, 8000);

      try {
        if (!item.categories || typeof item.categories.addAsync !== "function") {
          throw new Error("item.categories.addAsync no existe en este host");
        }
        item.categories.addAsync([CATEGORIA], function (result) {
          if (respondido) return;
          respondido = true;
          clearTimeout(avisoTimeout);
          boton.disabled = false;
          if (result.status === Office.AsyncResultStatus.Succeeded) {
            estado.textContent =
              "Hecho. En unos segundos el proceso local creará el recordatorio " +
              "(revisa Recordatorios en tu Mac).";
          } else {
            estado.textContent =
              "No se pudo etiquetar el correo: " +
              (result.error ? (result.error.message + " (código " + result.error.code + ")") : "error desconocido");
          }
        });
      } catch (e) {
        if (!respondido) {
          respondido = true;
          clearTimeout(avisoTimeout);
          boton.disabled = false;
          estado.textContent = "Error al llamar a categories.addAsync: " + e.message;
        }
      }
    }
  </script>
</body>
</html>
